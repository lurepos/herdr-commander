id = "herdr.commander"
name = "herdr-commander"
version = "0.2.1"
min_herdr_version = "0.7.0"
description = "Universal task runner and command palette for Herdr"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "picker"
title = "Commander"
command = ["sh", "bin/run.sh"]
placement = "popup"

[[actions]]
id = "open-picker"
title = "open commander"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr.commander", "--entrypoint", "picker", "--placement", "popup", "--focus"]
